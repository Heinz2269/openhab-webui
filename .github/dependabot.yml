version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/bundles/org.openhab.ui/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-patch-updates:
        update-types:
          - "patch"
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
